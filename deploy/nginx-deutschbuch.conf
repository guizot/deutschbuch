# Deutschbuch — static Astro build served by nginx.
#
# Files come from a bind mount: /var/www/deutschbuch -> ~/Documents/projects/deutschbuch/dist
# (nginx runs as www-data and cannot traverse /home/rpi5, which is mode 700).
#
# Same port as the old `python3 -m http.server 3008`, so every existing link and
# Tailscale bookmark keeps working unchanged.

server {
    listen 3008;
    listen [::]:3008;
    server_name _;

    root /var/www/deutschbuch;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Content-hashed assets never change under the same name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pronunciation clips: one file per word, named by content hash.
    location /audio/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { audio/mpeg mp3; }
        default_type audio/mpeg;
        try_files $uri =404;
    }

    # Static pages. Directory URLs resolve to their index.html.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    access_log /var/log/nginx/deutschbuch.access.log;
    error_log  /var/log/nginx/deutschbuch.error.log warn;
}

# ── Deployment notes ────────────────────────────────────────────────────
# 1. Bind mount (nginx runs as www-data; /home/rpi5 is mode 700):
#      /etc/fstab:
#      /home/rpi5/Documents/projects/deutschbuch/dist /var/www/deutschbuch none bind 0 0
#      sudo mkdir -p /var/www/deutschbuch && sudo mount --bind <src> /var/www/deutschbuch
# 2. Install:
#      sudo cp deploy/nginx-deutschbuch.conf /etc/nginx/sites-available/deutschbuch
#      sudo ln -s /etc/nginx/sites-available/deutschbuch /etc/nginx/sites-enabled/
#      sudo systemctl disable --now deutschbuch   # the old python http.server
#      sudo nginx -t && sudo systemctl reload nginx
# 3. Rollback:
#      sudo rm /etc/nginx/sites-enabled/deutschbuch && sudo systemctl reload nginx
#      sudo systemctl enable --now deutschbuch
